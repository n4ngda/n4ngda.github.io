<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<!-- Fixed browser tab title -->
<title>n4ngda</title>
<meta name="author" content="n4ngda">

<style>
html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background-color: #000000 !important; /* Forces pure black background */
    color: #ffffff;
}

body {
    min-height: 100vh;
    font-family: "Times New Roman", serif;
}

/* Minimal Screen Unlock Overlay */
#gate {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000000;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 9999;
    text-align: center;
}

.gate-btn {
    color: #888888;
    background: none;
    border: none;
    font-family: monospace;
    font-size: 16px;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 15px;
}

.gate-btn:hover {
    color: #ffffff;
}

/* Main content setup */
#main {
    display: none; /* Hidden until unlocked to satisfy browsers */
    min-height: 100vh;
    align-items: center;
    justify-content: center;
    text-align: center;
    background-color: #000000 !important; 
}

#timezone {
    font-size: 18px;
    color: #888888;
}

/* Centered high-resolution profile frame */
.profile-img {
    width: 300px; /* Kept tight and tidy */
    height: auto;
    margin: 25px auto; /* Moves it cleanly under the clock sequence */
    display: block;
    border: 1px solid #333333; /* Micro minimalist frame overlay */
}

a {
    color: #ffffff;
    text-decoration: none;
    cursor: pointer;
}

a:hover {
    background-color: #ffffff;
    color: #000000;
}

/* Jukebox Component Styling */
.audio-container {
    margin-top: 25px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.audio-label {
    font-size: 15px;
    font-style: italic;
    color: #888888;
    margin-bottom: 8px;
}

.audio-controls {
    display: flex;
    gap: 12px;
    font-size: 14px;
    font-family: monospace;
}

.audio-btn {
    color: #666666;
    cursor: pointer;
    user-select: none;
}

.audio-btn:hover {
    color: #ffffff;
    text-decoration: underline;
}

#shuffle-btn.active {
    color: #ffffff;
}

/* Sleek Minimalist Log Styling */
.log-container {
    margin-top: 40px;
    max-width: 340px;
    text-align: left;
    font-family: monospace;
    font-size: 13px;
    color: #888888;
    line-height: 1.6;
}

.log-title {
    color: #ffffff;
    font-size: 14px;
    margin-bottom: 10px;
    border-bottom: 1px dashed #333333;
    padding-bottom: 4px;
    text-align: center;
}

.log-entry {
    margin-bottom: 6px;
}

.log-date {
    color: #ffffff;
}
</style>

<script>
// PLAYLIST ARRAY
const playlist = [
    { title: "moon - prettifun", src: "SpotiDownloader.com - Moon - prettifun.mp3" },
    { title: "misery - matt proxy", src: "MISERY - matt proxy.mp3" }, 
    { title: "song 3 title", src: "music/song3.mp3" },
    { title: "song 4 title", src: "music/song4.mp3" },
    { title: "song 5 title", src: "music/song5.mp3" },
    { title: "song 6 title", src: "music/song6.mp3" },
    { title: "song 7 title", src: "music/song7.mp3" },
    { title: "song 8 title", src: "music/song8.mp3" },
    { title: "song 9 title", src: "music/song9.mp3" },
    { title: "song 10 title", src: "music/song10.mp3" }
];

let currentIndex = 0;
let isShuffle = false;
let trackHistory = [];

let audio, trackTitle, playBtn, shuffleBtn;

const formatter = new Intl.DateTimeFormat([], {
    timeZone: "Asia/Kolkata",
    hour: "numeric",
    minute: "numeric",
    second: "numeric",
    timeZoneName: "short"
});

function updateTime() {
    const parts = formatter.formatToParts(new Date());

    document.getElementById("time").textContent =
        parts
            .filter(part => part.type !== "timeZoneName")
            .map(part => part.value)
            .join("").toLowerCase();

    document.getElementById("tz").textContent =
        parts.find(part => part.type === "timeZoneName").value;
}

function loadTrack(index) {
    currentIndex = index;
    audio.src = playlist[currentIndex].src;
    if(trackTitle) {
        trackTitle.textContent = `now playing: ${playlist[currentIndex].title}`;
    }
}

function togglePlay() {
    if (audio.paused) {
        audio.play().catch(err => console.log(err));
        playBtn.textContent = "[pause]";
    } else {
        audio.pause();
        playBtn.textContent = "[play]";
    }
}

function nextTrack() {
    trackHistory.push(currentIndex);
    if (isShuffle) {
        let randomIndex;
        do {
            randomIndex = Math.floor(Math.random() * playlist.length);
        } while (randomIndex === currentIndex && playlist.length > 1);
        currentIndex = randomIndex;
    } else {
        currentIndex = (currentIndex + 1) % playlist.length;
    }
    loadTrack(currentIndex);
    audio.play().catch(err => console.log(err));
    playBtn.textContent = "[pause]";
}

function prevTrack() {
    if (trackHistory.length > 0) {
        currentIndex = trackHistory.pop();
    } else {
        currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
    }
    loadTrack(currentIndex);
    audio.play().catch(err => console.log(err));
    playBtn.textContent = "[pause]";
}

function toggleShuffle() {
    isShuffle = !isShuffle;
    if (isShuffle) {
        shuffleBtn.textContent = "[shuffle: on]";
        shuffleBtn.classList.add('active');
    } else {
        shuffleBtn.textContent = "[shuffle: off]";
        shuffleBtn.classList.remove('active');
        trackHistory = [];
    }
}

// Custom handler that unlocks screen and bypasses audio blocks safely
function unlockSite() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('main').style.display = 'flex';
    
    // Instantly try to fire music node upon entry click
    audio.play().then(() => {
        playBtn.textContent = "[pause]";
    }).catch(err => {
        console.log("Audio play blocked:", err);
        playBtn.textContent = "[play]";
    });

    document.removeEventListener('keydown', unlockSite);
}

window.onload = () => {
    updateTime();
    setInterval(updateTime, 1000);

    audio = document.getElementById('bg-audio');
    trackTitle = document.getElementById('track-title');
    playBtn = document.getElementById('play-btn');
    shuffleBtn = document.getElementById('shuffle-btn');

    audio.addEventListener('ended', nextTrack);

    loadTrack(currentIndex);

    // Bind triggers to bypass media blocks safely
    document.getElementById('enter-btn').addEventListener('click', unlockSite);
    document.addEventListener('keydown', unlockSite);
};
</script>

</head>

<body>

<!-- Entrance Gate -->
<div id="gate">
    <font size="6"><i><b>「N4NGDA」</b></i></font>
    <button id="enter-btn" class="gate-btn">[press any key to enter]</button>
</div>

<div id="main">
    <div>

        <font size="12"><i><b>「N4NGDA」</b></i></font>

        <br><br>

        <span id="timezone">
            <i>
                TIME IN IMPHAL -
                <span id="time">0:00 pm</span>
                <span id="tz">IST</span>
            </i>
        </span>

        <!-- Render only the high-res image.jpg cleanly in the middle -->
        <img src="image.jpg" class="profile-img" alt="n4ngda profile image">

        <a href="https://instagram.com" target="_blank">instagram</a> //
        <a href="https://spotify.com" target="_blank">spotify</a> //
        <a href="https://strava.com" target="_blank">strava</a>

        <!-- Jukebox Component -->
        <div class="audio-container">
            <audio id="bg-audio" src=""></audio> 
            <div class="audio-label" id="track-title">now playing: loading...</div>
            <div class="audio-controls">
                <span class="audio-btn" onclick="prevTrack()">[prev]</span>
                <span class="audio-btn" id="play-btn" onclick="togglePlay()">[play]</span>
                <span class="audio-btn" onclick="nextTrack()">[next]</span>
                <span class="audio-btn" id="shuffle-btn" onclick="toggleShuffle()">[shuffle: off]</span>
            </div>
        </div>

        <!-- NEW SMALL LOG SECTION -->
        <!-- You can easily add more lines inside this div to document your log updates! -->
        <div class="log-container">
            <div class="log-title">~/updates</div>
            <div class="log-entry"><span class="log-date">{27-8-26}</span> refreshed layout / launched custom jukebox</div>
            <div class="log-entry"><span class="log-date">{26-8-26}</span> updated high-res imagery frame asset</div>
        </div>

    </div>
</div>

</body>
</html>
