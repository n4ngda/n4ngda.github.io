<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n4ngda</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: #121212;
            color: #e0e0e0;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
            line-height: 1.6;
        }
        h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            letter-spacing: -1px;
        }
        a {
            color: #888;
            text-decoration: none;
            border-bottom: 1px dotted #555;
        }
        a:hover {
            color: #fff;
            border-bottom: 1px solid #fff;
        }
        .meta-info {
            font-size: 0.9rem;
            color: #777;
            margin-bottom: 30px;
        }
        .nav-links {
            margin: 20px 0;
            padding: 0;
            list-style: none;
        }
        .nav-links li {
            margin-bottom: 8px;
        }
        .music-container {
            margin-top: 40px;
            border-top: 1px dashed #333;
            padding-top: 20px;
        }
    </style>
</head>
<body>

    <h1>n4ngda</h1>
    <div class="meta-info">
        <span id="live-clock">Imphal: Loading...</span>
    </div>

    <ul class="nav-links">
        <li>→ <a href="https://instagram.com" target="_blank">instagram</a></li>
        <li>→ <a href="https://www.strava.com/athletes/179097665" target="_blank">strava</a></li>
        <li>→ <a href="https://github.com" target="_blank">github</a></li>
    </ul>

    <div class="music-container">
        <p style="font-size: 0.85rem; color: #666; margin-bottom: 10px;">// currently listening to:</p>
        <!-- Your custom 16th August playlist embed -->
        <iframe style="border-radius:12px" src="https://spotify.com" width="100%" height="152" frameBorder="0" allowfullscreen="" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" loading="lazy"></iframe>
    </div>

    <script>
        function updateClock() {
            const options = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };
            
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('live-clock').textContent = `Imphal: ${formatter.format(new Date())}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

</body>
</html>
