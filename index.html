<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n4ngda</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: monospace;
            line-height: 1.6;
            max-width: 600px;
            margin: 50px auto;
            padding: 0 20px;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 5px;
        }

        .clock {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-bottom: 30px;
        }

        li {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .spotify-wrapper {
            margin-top: 30px;
            border: 1px dashed #333333;
            padding: 4px;
        }
    </style>
</head>
<body>

    <h1>n4ngda</h1>
    <!-- Live terminal style clock -->
    <div class="clock" id="imphal-clock">loading time...</div>

    <ul>
        <li>-> <a href="https://instagram.com" target="_blank">instagram</a></li>
        <li>-> <a href="https://spotify.com" target="_blank">spotify</a></li>
        <li>-> <a href="https://strava.com" target="_blank">strava</a></li>
    </ul>

    <div class="spotify-wrapper">
        <iframe style="border-radius:0px" 
            src="https://spotify.com" 
            width="100%" 
            height="152" 
            frameBorder="0" 
            allowfullscreen="" 
            allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture" 
            loading="lazy">
        </iframe>
    </div>

    <script>
        function updateClock() {
            const options = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            
            const formatter = new Intl.DateTimeFormat('en-US', options);
            const timeString = formatter.format(new Date());
            
            document.getElementById('imphal-clock').textContent = `imphal // ${timeString.toLowerCase()}`;
        }

        // Run clock immediately and update every second
        updateClock();
        setInterval(updateClock, 1000);
    </script>

</body>
</html>
