<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n4ngda</title>
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: monospace;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Minimalist Entry Gate Overlay */
        #gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #enter-btn {
            color: #ffffff;
            background: none;
            border: none;
            font-family: monospace;
            font-size: 0.95rem;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 15px;
            padding: 5px 10px;
        }

        #enter-btn:hover {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
        }

        /* Main website components hidden at load */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .clock {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-bottom: 40px;
        }

        li {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        .audio-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .audio-label {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 8px;
        }

        audio {
            width: 100%;
            max-width: 300px;
            filter: invert(1) hue-rotate(180deg);
        }
    </style>
</head>
<body>

    <!-- Entry Gate Screen -->
    <div id="gate">
        <h1>n4ngda</h1>
        <button id="enter-btn">[enter]</button>
    </div>

    <!-- Centered Profile Layout Content -->
    <div id="main-content">
        <h1>n4ngda</h1>
        <div class="clock" id="imphal-clock">loading time...</div>

        <ul>
            <li>-> <a href="https://instagram.com/n4ngda" target="_blank">instagram</a></li>
            <li>-> <a href="https://open.spotify.com/user/31mukm76ymettqxaris6z2jgosbu" target="_blank">spotify</a></li>
            <li>-> <a href="https://www.strava.com/athletes/179097665" target="_blank">strava</a></li>
        </ul>

        <div class="audio-container">
            <div class="audio-label">now playing: moon - prettifun</div>
            <audio id="bg-audio" controls loop src="SpotiDownloader.com - Moon - prettifun.mp3"></audio> 
        </div>
    </div>

    <script>
        function updateClock() {
            const options = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('imphal-clock').textContent = `imphal // ${formatter.format(new Date()).toLowerCase()}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Click interaction logic to drop gate layer and activate loop audio stream
        document.getElementById('enter-btn').addEventListener('click', function() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            const audio = document.getElementById('bg-audio');
            audio.play().catch(err => console.log("Audio play blocked:", err));
        });
    </script>

</body>
</html>
