<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>n4ngda</title>
    <style>
        body {
            background-color: #000000 !important;
            color: #ffffff !important;
            font-family: monospace;
            line-height: 1.6;
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Minimalist Entry Gate Overlay */
        #gate {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        #enter-instruction {
            color: #888888;
            font-size: 0.85rem;
            margin-top: 15px;
        }

        #enter-btn {
            color: #ffffff;
            background: none;
            border: none;
            font-family: monospace;
            font-size: 0.95rem;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 5px;
            padding: 5px 10px;
        }

        #enter-btn:hover {
            background-color: #ffffff;
            color: #000000;
            text-decoration: none;
        }

        /* Main website components hidden at load */
        #main-content {
            display: none;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 1.1rem;
            font-weight: normal;
            margin-bottom: 5px;
            color: #ffffff;
        }

        .clock {
            font-size: 0.9rem;
            color: #888888;
            margin-bottom: 30px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            margin-bottom: 40px;
        }

        li {
            font-size: 0.95rem;
            margin-bottom: 10px;
        }

        a {
            color: #ffffff;
            text-decoration: none;
        }

        a:hover {
            background-color: #ffffff;
            color: #000000;
        }

        /* Sleek Audio Layout */
        .audio-container {
            margin-top: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .audio-label {
            font-size: 0.85rem;
            color: #888888;
            margin-bottom: 8px;
        }

        .audio-controls {
            display: flex;
            gap: 12px;
            font-size: 0.85rem;
        }

        .audio-btn {
            color: #888888;
            cursor: pointer;
            user-select: none;
        }

        .audio-btn:hover {
            color: #ffffff;
            text-decoration: underline;
        }
        
        #shuffle-btn.active {
            color: #ffffff;
        }
    </style>
</head>
<body>

    <!-- Entry Gate Screen -->
    <div id="gate">
        <h1>n4ngda</h1>
        <div id="enter-instruction">press any key or</div>
        <button id="enter-btn">[enter]</button>
    </div>

    <!-- Centered Profile Layout Content -->
    <div id="main-content">
        <h1>n4ngda</h1>
        <div class="clock" id="imphal-clock">loading time...</div>

        <ul>
            <li>-> <a href="https://instagram.com/n4ngda" target="_blank">instagram</a></li>
            <li>-> <a href="https://open.spotify.com/user/31mukm76ymettqxaris6z2jgosbu" target="_blank">spotify</a></li>
            <li>-> <a href="https://www.strava.com/athletes/179097665" target="_blank">strava</a></li>
        </ul>

        <div class="audio-container">
            <audio id="bg-audio" src=""></audio> 
            <div class="audio-label" id="track-title">now playing: loading...</div>
            <div class="audio-controls">
                <span class="audio-btn" onclick="prevTrack()">[prev]</span>
                <span class="audio-btn" id="play-btn" onclick="togglePlay()">[pause]</span>
                <span class="audio-btn" onclick="nextTrack()">[next]</span>
                <span class="audio-btn" id="shuffle-btn" onclick="toggleShuffle()">[shuffle: off]</span>
            </div>
        </div>
    </div>

    <script>
        // 1. ADD NEW MP3 FILES HERE
        // Put the files in your repo folder. Change track names and file names below.
        const playlist = [
            { title: "moon - prettifun", src: "SpotiDownloader.com - Moon - prettifun.mp3" },
            { title: "track two - artist name", src: "music/track2.mp3" },
            { title: "track three - artist name", src: "music/track3.mp3" }
        ];

        let currentIndex = 0;
        let isShuffle = false;
        let trackHistory = [];

        const audio = document.getElementById('bg-audio');
        const trackTitle = document.getElementById('track-title');
        const playBtn = document.getElementById('play-btn');
        const shuffleBtn = document.getElementById('shuffle-btn');

        function updateClock() {
            const options = {
                timeZone: 'Asia/Kolkata',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: true
            };
            const formatter = new Intl.DateTimeFormat('en-US', options);
            document.getElementById('imphal-clock').textContent = `imphal // ${formatter.format(new Date()).toLowerCase()}`;
        }
        updateClock();
        setInterval(updateClock, 1000);

        // Load targeted track metadata
        function loadTrack(index) {
            currentIndex = index;
            audio.src = playlist[currentIndex].src;
            trackTitle.textContent = `now playing: ${playlist[currentIndex].title}`;
        }

        // Toggle native play / pause engine state
        function togglePlay() {
            if (audio.paused) {
                audio.play().catch(err => console.log(err));
                playBtn.textContent = "[pause]";
            } else {
                audio.pause();
                playBtn.textContent = "[play]";
            }
        }

        // Advance to next audio node
        function nextTrack() {
            trackHistory.push(currentIndex);
            if (isShuffle) {
                let randomIndex;
                do {
                    randomIndex = Math.floor(Math.random() * playlist.length);
                } while (randomIndex === currentIndex && playlist.length > 1);
                currentIndex = randomIndex;
            } else {
                currentIndex = (currentIndex + 1) % playlist.length;
            }
            loadTrack(currentIndex);
            audio.play().catch(err => console.log(err));
            playBtn.textContent = "[pause]";
        }

        // Revert to historical or previous audio node
        function prevTrack() {
            if (trackHistory.length > 0) {
                currentIndex = trackHistory.pop();
            } else {
                currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
            }
            loadTrack(currentIndex);
            audio.play().catch(err => console.log(err));
            playBtn.textContent = "[pause]";
        }

        // Toggle random playlist playback logic
        function toggleShuffle() {
            isShuffle = !isShuffle;
            if (isShuffle) {
                shuffleBtn.textContent = "[shuffle: on]";
                shuffleBtn.classList.add('active');
            } else {
                shuffleBtn.textContent = "[shuffle: off]";
                shuffleBtn.classList.remove('active');
                trackHistory = [];
            }
        }

        // Trigger next track immediately when song finishes looping
        audio.addEventListener('ended', nextTrack);

        // Core unlock page action function
        function unlockSite() {
            document.getElementById('gate').style.display = 'none';
            document.getElementById('main-content').style.display = 'flex';
            
            // Fire current loaded audio tracks right away
            audio.play().catch(err => {
                console.log("Audio play blocked:", err);
                playBtn.textContent = "[play]";
            });

            document.removeEventListener('keydown', unlockSite);
        }

        // Seed initialization tracks
        loadTrack(currentIndex);

        // Entry point bindings
        document.getElementById('enter-btn').addEventListener('click', unlockSite);
        document.addEventListener('keydown', unlockSite);
    </script>

</body>
</html>
